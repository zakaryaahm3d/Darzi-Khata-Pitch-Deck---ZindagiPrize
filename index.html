<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Darzi Khata — Pitch Deck</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=Noto+Nastaliq+Urdu&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8FAFC;
  --card:#ffffff;
  --ink:#1E293B;
  --mute:#64748B;
  --line:#e2e8f0b0;
  --em:#047857;
  --emd:#064E3B;
  --gold:#D97706;
  --gold2:#F59E0B;
  --dark:#0B0F17;
  --dk-ink:#F1F5F9;
  box-sizing:border-box;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0F17;
    --card:#151B27;
    --ink:#F1F5F9;
    --mute:#94A3B8;
    --line:#33415580;
    --em:#10B981;
    --gold:#F59E0B;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.ur{font-family:'Noto Nastaliq Urdu',serif;direction:rtl}

#deck{position:relative;height:100%;overflow:hidden}
.slide{
  position:absolute;
  inset:0;
  padding:clamp(16px,3.5vw,48px) clamp(16px,4.5vw,64px) 84px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:clamp(10px,1.6vh,20px);
  overflow-y:auto;
  opacity:0;
  pointer-events:none;
  transform:translateX(36px);
  transition:opacity .4s ease, transform .4s cubic-bezier(.2,.7,.2,1);
}
.slide.on{opacity:1;pointer-events:auto;transform:none}
.slide.prev{transform:translateX(-36px)}
.slide.dark{background:var(--dark);color:var(--dk-ink);--card:#151B27;--ink:#F1F5F9;--mute:#94A3B8;--line:#33415580}
.slide.dark .ey{color:var(--gold2)}

.ey{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:800}
h1{font-size:clamp(2rem,6.5vw,4.5rem);line-height:1.05;font-weight:800;letter-spacing:-0.02em}
h2{font-size:clamp(1.4rem,3vw,2.2rem);line-height:1.15;font-weight:800;letter-spacing:-0.01em}
p{color:var(--mute);line-height:1.55;font-size:clamp(.88rem,1.3vw,1.02rem)}

.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.grid-3{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px 18px;
  box-shadow:0 4px 18px #0f172a0a;
}
.card h3{font-size:1.05rem;margin:8px 0 4px;font-weight:700}
.card p{font-size:.88rem}

.ic{
  width:38px;height:38px;border-radius:10px;
  background:linear-gradient(135deg,var(--emd),var(--em));
  color:#fff;display:grid;place-items:center;font-size:1.15rem;
}
.big{font-size:clamp(1.6rem,3.2vw,2.6rem);font-weight:800;color:var(--gold)}
.badge{
  display:inline-block;padding:5px 12px;border-radius:99px;
  background:#ffffff15;border:1px solid #ffffff25;backdrop-filter:blur(8px);
  font-size:.78rem;font-weight:700;
}
.quote-box{
  border-left:4px solid var(--gold);
  background:#d9770610;
  border-radius:0 14px 14px 0;
  padding:14px 18px;
  font-style:italic;
  color:var(--ink);
  font-size:clamp(.92rem,1.4vw,1.08rem);
  line-height:1.5;
}

/* Screen mockup cards */
.screen-col{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px 12px;
  box-shadow:0 4px 18px #0f172a08;
}
.screen-num{
  align-self:flex-start;
  width:26px;height:26px;border-radius:6px;
  background:#04785720;color:var(--em);
  display:grid;place-items:center;font-weight:800;font-size:.85rem;
}
.screen-col h3{font-size:.95rem;font-weight:700;margin-top:2px;width:100%}
.screen-col p{font-size:.82rem;line-height:1.45;width:100%}
/* Screenshots already include their own frame and caption, so show them whole (no cropping) */
.screen-img-box{
  width:100%;
  max-width:260px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.screen-img{
  width:100%;
  height:auto;
  max-height:46vh;
  object-fit:contain;
  display:block;
  border-radius:10px;
}

/* Dock & drawer */
#dock{
  position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);display:flex;align-items:center;gap:4px;
  padding:5px 8px;border-radius:99px;background:#0B0F17e6;backdrop-filter:blur(12px);
  border:1px solid #ffffff25;z-index:20;box-shadow:0 8px 30px #00000040;
}
#dock button{
  width:38px;height:38px;border:0;border-radius:50%;background:transparent;
  color:#fff;font-size:1.1rem;cursor:pointer;display:grid;place-items:center;
  transition:background .2s;
}
#dock button:hover{background:#ffffff20}
#ctr{color:#fff;font-weight:700;font-size:.82rem;padding:0 8px;font-variant-numeric:tabular-nums}

#dr{
  position:fixed;inset:0;background:#0B0F17f2;z-index:30;display:none;
  padding:calc(20px + env(safe-area-inset-top,0px)) 20px 20px;overflow:auto;
}
#dr.o{display:block}
#dr .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
#dr .th{
  background:var(--card);color:var(--ink);border:1px solid var(--line);
  border-radius:12px;padding:12px;cursor:pointer;text-align:left;
  font:600 .82rem 'Plus Jakarta Sans',sans-serif;min-height:80px;
}
#dr .th small{display:block;color:var(--gold);margin-bottom:4px}
#dr .th.c{outline:2px solid var(--gold2)}
</style>
</head>
<body>

<div id="deck"></div>

<div id="dock">
  <button id="pv" aria-label="Previous">‹</button>
  <span id="ctr">01 / 08</span>
  <button id="nx" aria-label="Next">›</button>
  <button id="gr" aria-label="Slide overview">▦</button>
  <button id="fs" aria-label="Fullscreen">⛶</button>
  <button id="dl" aria-label="Download HTML" title="Download HTML Deck">⭳</button>
</div>

<div id="dr">
  <div style="display:flex;justify-content:space-between;color:#fff;margin-bottom:14px">
    <b>Jump to slide</b>
    <button id="cl" style="background:none;border:0;color:#fff;font-size:1.4rem;cursor:pointer">×</button>
  </div>
  <div class="grid" id="tg"></div>
</div>

<script>
const C=(i,t,d,x='')=>`<div class="card"><div class="ic">${i}</div><h3>${t}</h3><p>${d}</p>${x}</div>`;

/* Slide 04 screenshots: save the three images next to this HTML file with these exact names */
const IMG_HISAAB='hisaab.png';
const IMG_PARCHI='parchi.png';
const IMG_CREDIT='credit-score.png';

const S=[
  [
    'Cover',
    `<span class="badge" style="align-self:flex-start">Pitch Deck · Zindagi Prize '26</span>
     <div class="ey">درزی کھاتہ</div>
     <h1>Darzi Khata <span class="ur" style="font-size:.5em;color:var(--gold2)">درزی کھاتہ</span></h1>
     <h2 style="color:var(--gold2)">Digitizing Pakistan's Bespoke Craftsmanship</h2>
     <p style="max-width:640px">A simple, Urdu-first phone application empowering local master tailors to replace paper registers with instant WhatsApp parchis, order pipelines, and credit trails.</p>
     <p style="font-size:.82rem;margin-top:6px">Presented by: <b>Zakarya Ahmad · Saadia Asghar · Umaiza Eshal</b></p>`,
    1
  ],
  [
    'The Story',
    `<div class="ey">The Human Reality · ہماری تحقیق</div>
     <h2>Walking through the alleys of Rawalpindi & Islamabad</h2>
     <div class="quote-box">
       "Eid par 300 joray aate hain beta. Ek parchi ghoom jaye to gahak larta hai, aur karigar alag hisaab maangta hai. Akhir mein idhar udhaar ka pata hi nahi chalta."
       <div style="font-weight:700;font-style:normal;margin-top:6px;font-size:.85rem;color:var(--em)">— Master Muhammad Arif, Saddar Bazaar</div>
     </div>
     <div class="grid">
       ${C('✂','Tea-stained paper registers','Measurements written on torn paper slips. When a slip gets lost, loyal customers must be remeasured.')}
       ${C('🌙','Eid festival delivery panic','Delivery dates kept purely in memory or chalk notes, causing delayed orders and angry walk-outs.')}
       ${C('💸','Vanishing udhaar & zero bank trail','Almost all cash or forgotten balances. Tailors generate steady cashflow, but cannot prove their income to any bank.')}
     </div>`
  ],
  [
    'The Spark',
    `<div class="ey">The Spark · خیال کی شروعات</div>
     <h2>"What if Master Ji carried his entire workshop in his pocket?"</h2>
     <p style="max-width:760px">We didn't design a complicated enterprise ERP. We built an offline-capable, pocket assistant in familiar Urdu that respects the craft and dignity of Pakistani master tailors.</p>
     <div class="grid">
       ${C('📐','1-Tap Size Profiles','Record chest, shoulder, length, and ghair once. Re-use forever for repeat customers without remeasuring.')}
       ${C('💬','Zero-Paper Trust via WhatsApp','Auto-send a digital parchi with stitch specs, balance due, and an instant Raast QR code to the customer.')}
       ${C('📈','Unlocking Dignified Finance','Turn everyday ledger entries into an auditable credit score to secure working capital without collateral.')}
     </div>`
  ],
  [
    'How it Works',
    `<div class="ey">02 · How it works · حل کا عملی استعمال</div>
     <h2>From measurement tape to WhatsApp payment</h2>
     <div class="grid-3">
       <div class="screen-col">
         <span class="screen-num">1</span>
         <h3>Record order & measurements</h3>
         <p>Kameez, shalwar & waistcoat fields arranged in the exact order tailors measure. Saved offline.</p>
         <div class="screen-img-box">
           <img class="screen-img" src="${IMG_HISAAB}" alt="Hisaab: who paid, how, and what is still baqi">
         </div>
       </div>

       <div class="screen-col">
         <span class="screen-num">2</span>
         <h3>Send parchi on WhatsApp</h3>
         <p>Shows total, advance, baqi, and account details with a direct scan-ready Zindigi or Raast QR.</p>
         <div class="screen-img-box">
           <img class="screen-img" src="${IMG_PARCHI}" alt="Parchi with an illustrative QR and account details, ready for WhatsApp">
         </div>
       </div>

       <div class="screen-col">
         <span class="screen-num">3</span>
         <h3>Build a credit score from khata</h3>
         <p>On-time deliveries, regular collection, and digital shares create a profile tailored for lenders.</p>
         <div class="screen-img-box">
           <img class="screen-img" src="${IMG_CREDIT}" alt="Credit profile with the factors behind the score">
         </div>
       </div>
     </div>`
  ],
  [
    'Operations',
    `<div class="ey">Team & Money · ٹیم اور حساب کتاب</div>
     <h2>Managing karigars, pipelines, and cashflow in real time</h2>
     <div class="grid">
       ${C('👷','Multi-Karigar Piece Rate','Allocate suits to individual specialist cutters and stitchers. The app calculates their weekly per-suit wages automatically.')}
       ${C('🗂','Live Kanban Pipeline','Track every suit visually: <i>Pending → Cutting → Stitching → Trial → Ready</i>. No misplaced garments.')}
       ${C('📒','Cashflow & Udhaar Recovery','Separate cash on hand from uncollected balances (baqi). Send polite, automated WhatsApp reminders before festival dates.')}
       ${C('📶','100% Offline Resilience','Local storage ensures shop owners can record orders, measurements, and tokens even when shop Wi-Fi or cellular data drops.')}
     </div>`
  ],
  [
    'Business Model',
    `<div class="ey">Monetization · آمدنی کا ماڈل</div>
     <h2>A win-win business model built for adoption</h2>
     <div class="grid">
       ${C('🆓','Free Basic Tier','Record up to 30 orders/month, measurement profiles, and manual WhatsApp sharing. Zero friction to adopt.','<div class="big" style="margin-top:8px">Rs 0</div>')}
       ${C('⭐','Darzi Pro Subscription','Unlimited orders, automated multi-karigar wage calculation, cloud backup, and multi-staff accounts.','<div class="big" style="margin-top:8px">Rs 300<span style="font-size:.45em;color:var(--mute)">/mo</span></div>')}
       ${C('🤝','Fintech & Bank Integration','Partner commissions on micro-loan disbursals and merchant payment processing via Zindigi / Raast.','<div class="big" style="margin-top:8px">1.0% - 2.5%<span style="font-size:.45em;color:var(--mute)"> com.</span></div>')}
     </div>`
  ],
  [
    'Roadmap',
    `<div class="ey">Vision · وژن اور مستقبل</div>
     <h2>Scaling the ecosystem step-by-step</h2>
     <div class="grid">
       ${C('🎙','Phase 1: Urdu Voice Entry','Hands-free voice recognition allowing tailors to speak numbers into the app while holding the measuring tape.')}
       ${C('🏦','Phase 2: Formal Micro-Lending','Direct consent-based integration with Zindigi/banks for sewing machine loans and fabric working capital.')}
       ${C('🧵','Phase 3: Wholesale Marketplace','Connecting verified neighborhood tailors directly with Faisalabad and Karachi textile mills at bulk trade rates.')}
     </div>`
  ],
  [
    'Close',
    `<div class="ey">Impact · ہمارا عزم</div>
     <h1 style="font-size:clamp(1.8rem,5.5vw,3.6rem)">Digitizing Pakistan’s Bespoke Craftsmanship, One Stitch at a Time.</h1>
     <div class="grid" style="margin-top:8px">
       <div class="card"><div class="big">0 Lost</div><p>Zero lost parchis or repeated measurements</p></div>
       <div class="card"><div class="big">100%</div><p>Accurate delivery deadlines and tracked karigar wages</p></div>
       <div class="card"><div class="big">Financial</div><p>Direct pathway from informal cash to institutional credit</p></div>
     </div>
     <div style="margin-top:10px">
       <a class="badge" style="color:var(--gold2);text-decoration:none;padding:10px 20px;font-size:.9rem" href="https://darzi-khata.replit.app" target="_blank" rel="noopener">Open Live Prototype ↗</a>
     </div>`,
    1
  ]
];

const D=document.getElementById('deck');
const tg=document.getElementById('tg');
let n=0;

S.forEach((s,i)=>{
  D.insertAdjacentHTML('beforeend',`<section class="slide${s[2]?' dark':''}">${s[1]}</section>`);
  tg.insertAdjacentHTML('beforeend',`<button class="th" data-i="${i}"><small>${String(i+1).padStart(2,'0')}</small>${s[0]}</button>`);
});

const L=[...D.children];

function go(i){
  n=Math.max(0,Math.min(S.length-1,i));
  L.forEach((e,j)=>{
    e.className=e.className.replace(/ ?(on|prev)/g,'')+(j===n?' on':j<n?' prev':'');
  });
  document.getElementById('ctr').textContent=String(n+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0');
  [...tg.children].forEach((b,j)=>b.classList.toggle('c',j===n));
  try{history.replaceState(null,'','#s'+(n+1))}catch(e){}
}

const dr=document.getElementById('dr');
const pv=document.getElementById('pv');
const nx=document.getElementById('nx');
const gr=document.getElementById('gr');
const cl=document.getElementById('cl');
const fs=document.getElementById('fs');
const dl=document.getElementById('dl');

pv.onclick=()=>go(n-1);
nx.onclick=()=>go(n+1);
gr.onclick=()=>dr.classList.add('o');
cl.onclick=()=>dr.classList.remove('o');

tg.onclick=e=>{
  const b=e.target.closest('.th');
  if(b){go(+b.dataset.i);dr.classList.remove('o')}
};

fs.onclick=()=>{
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  }else{
    document.exitFullscreen && document.exitFullscreen();
  }
};

dl.onclick=()=>{
  const content = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  const blob = new Blob([content], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'darzi-khata-deck.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(n+1)}
  else if(e.key==='ArrowLeft'){e.preventDefault();go(n-1)}
  else if(e.key==='Escape'){dr.classList.remove('o')}
});

let x0=null;
addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{
  if(x0!==null){
    const d=e.changedTouches[0].clientX-x0;
    if(Math.abs(d)>60)go(n+(d<0?1:-1));
    x0=null;
  }
});

const h=parseInt((location.hash.match(/^#s(\d+)$/)||[])[1]);
go(h?h-1:0);
</script>

</body></html>
